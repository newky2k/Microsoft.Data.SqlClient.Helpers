# Pull request validation: builds Release. Publishes nothing.
# Runs on pull requests into development (features and bug fixes) and into main (releases).
name: CI

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # windows is required for the SqlHelperSample (net10.0-windows) and the net462 targets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore Microsoft.Data.SqlClient.Helpers.slnx

      - name: Build
        run: dotnet build Microsoft.Data.SqlClient.Helpers.slnx --configuration Release --no-restore
